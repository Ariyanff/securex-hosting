<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureX Hosting - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-deep: #070512;
      --bg-card: rgba(18, 14, 38, 0.75);
      --border-color: rgba(139, 92, 246, 0.25);
      --border-focus: rgba(6, 182, 212, 0.8);
      --purple: #8b5cf6;
      --purple-dark: #6d28d9;
      --cyan: #06b6d4;
      --cyan-light: #22d3ee;
      --glow-purple: rgba(139, 92, 246, 0.4);
      --glow-cyan: rgba(6, 182, 212, 0.35);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --font-family: 'Inter', sans-serif;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    /* GPU-accelerated Lag-free Ambient Glow Orbs */
    .ambient-glow {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(90px);
      opacity: 0.5;
      will-change: transform;
      z-index: 0;
    }
    .orb-1 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.7) 0%, rgba(109, 40, 217, 0) 70%);
      top: -80px;
      left: -80px;
      animation: floatOrb 12s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.6) 0%, rgba(6, 182, 212, 0) 70%);
      bottom: -100px;
      right: -100px;
      animation: floatOrb 14s ease-in-out infinite alternate-reverse;
    }
    .orb-3 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.4) 0%, rgba(139, 92, 246, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }
    @keyframes floatOrb {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(50px, 40px, 0) scale(1.1); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: translate3d(-50%, -50%, 0) scale(0.95); }
      100% { opacity: 0.55; transform: translate3d(-50%, -50%, 0) scale(1.08); }
    }
    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }
    .login-container {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 44px 38px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 0 35px var(--glow-purple), 0 20px 50px rgba(0, 0, 0, 0.7);
      text-align: center;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }
    .login-container:hover {
      border-color: rgba(6, 182, 212, 0.5);
      box-shadow: 0 0 45px var(--glow-cyan), 0 25px 60px rgba(0, 0, 0, 0.8);
    }
    .icon-wrapper {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px auto;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(6, 182, 212, 0.25));
      border: 1px solid rgba(139, 92, 246, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--glow-purple);
      animation: iconFloat 4s ease-in-out infinite;
    }
    @keyframes iconFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .icon-wrapper i {
      font-size: 32px;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-name {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #ffffff 30%, var(--cyan-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .brand-sub {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--purple);
      text-transform: uppercase;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.3);
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 28px;
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.2);
    }
    .form-group {
      margin-bottom: 22px;
      text-align: left;
    }
    .form-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--purple);
      font-size: 14px;
      transition: color 0.3s;
    }
    .form-input {
      width: 100%;
      padding: 13px 16px 13px 40px;
      background: rgba(10, 7, 24, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .form-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 18px var(--glow-cyan);
      background: rgba(15, 11, 35, 0.95);
    }
    .form-input:focus + i {
      color: var(--cyan);
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--purple) 0%, var(--cyan) 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 20px var(--glow-purple);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px var(--glow-cyan), 0 5px 15px rgba(0, 0, 0, 0.4);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 18px;
      display: none;
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .login-footer {
      margin-top: 24px;
      font-size: 12px;
      color: rgba(148, 163, 184, 0.6);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="ambient-glow orb-1"></div>
  <div class="ambient-glow orb-2"></div>
  <div class="ambient-glow orb-3"></div>

  <div class="login-wrapper">
    <div class="login-container">
      <div class="icon-wrapper">
        <i class="fas fa-shield-halved"></i>
      </div>
      <h1 class="brand-name">SecureX Hosting</h1>
      <span class="brand-sub">PREMIUM PANEL ACCESS</span>

      <div class="error-msg" id="error-msg">
        <i class="fas fa-circle-exclamation"></i> Incorrect password. Access denied.
      </div>

      <div class="form-group">
        <label class="form-label" for="password">
          <span>Master Password</span>
          <i class="fas fa-key" style="color:var(--cyan);font-size:11px;"></i>
        </label>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-input" placeholder="Enter password to authenticate..." onkeypress="if(event.key === 'Enter') login()">
          <i class="fas fa-lock"></i>
        </div>
      </div>

      <button class="btn-login" id="btn-submit" onclick="login()">
        <span>Authenticate Access</span>
        <i class="fas fa-arrow-right"></i>
      </button>

      <div class="login-footer">
        Powered by SecureX Cloud Hosting
      </div>
    </div>
  </div>

  <script>
    async function login() {
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      const btn = document.getElementById('btn-submit');

      if (!password) {
        errorMsg.innerHTML = '<i class="fas fa-circle-exclamation"></i> Please enter password.';
        errorMsg.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span>Verifying...</span> <i class="fas fa-spinner fa-spin"></i>';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await res.json();
        if (data.success) {
          btn.innerHTML = '<span>Success! Redirecting...</span> <i class="fas fa-check"></i>';
          btn.style.background = 'linear-gradient(135deg, #10b981, #06b6d4)';
          window.location.href = '/';
        } else {
          errorMsg.innerHTML = '<i class="fas fa-circle-exclamation"></i> Incorrect password. Access denied.';
          errorMsg.style.display = 'block';
          document.getElementById('password').value = '';
          btn.disabled = false;
          btn.innerHTML = '<span>Authenticate Access</span> <i class="fas fa-arrow-right"></i>';
        }
      } catch (err) {
        errorMsg.innerHTML = '<i class="fas fa-circle-exclamation"></i> Connection error. Try again.';
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<span>Authenticate Access</span> <i class="fas fa-arrow-right"></i>';
      }
    }
  </script>
</body>
</html>
